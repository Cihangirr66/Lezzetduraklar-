<!doctype html>
{% load static %}
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mekanı Sil</title>
    {% include "partials/theme_head.html" %}
    <style>
        * { box-sizing: border-box; }
        html { overflow-x: hidden; }
        body { margin: 0; background: #f6f8fb; font-family: "Inter", "Segoe UI", sans-serif; overflow-x: hidden; }
        .topbar {
            background: #5d4037;
            color: #fff;
            border-bottom: 3px solid #3e2723;
            padding: 12px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .brand { display: inline-flex; align-items: center; text-decoration: none; }
        .brand-logo { height: 72px; width: auto; display: block; }
        .auth-links a {
            margin-left: 12px;
            text-decoration: none;
            color: #fff2cc;
            font-weight: 700;
        }
        .wrap {
            max-width: 700px;
            margin: 14px auto 24px;
            background: #fffdf9;
            border: 1px solid #b8aa93;
            padding: 20px;
            border-radius: 14px;
            box-shadow: var(--shadow);
        }
        .actions { display: flex; gap: 10px; }
        button.danger-btn {
            padding: 8px 12px;
            border: 1px solid #7f1d1d;
            background: #b91c1c !important;
            color: #fff !important;
            border-color: #7f1d1d !important;
        }
        a { color: #5d4037; }
        @media (max-width: 600px) {
            .brand-logo { height: 54px; }
            .topbar {
                padding: 10px 12px;
            }
            .auth-links a {
                margin-left: 0;
            }
            .wrap {
                width: calc(100% - 20px);
                margin: 22px auto;
                padding: 16px;
            }
            .actions {
                display: grid;
                grid-template-columns: 1fr;
            }
            button,
            .actions a {
                min-height: 42px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
{% include "partials/theme_toggle.html" %}
<header class="topbar">
    <a class="brand" href="{% url 'home' %}" aria-label="Ana Sayfa">
        <img class="brand-logo" src="{% static 'images/lezzet-duraklari-logo.png' %}" alt="Lezzet Durakları logosu">
    </a>
    <div class="auth-links">
        <a href="{% url 'home' %}">Keşfet</a>
    </div>
</header>
<div class="wrap">
    <h1>Mekanı Sil</h1>
    <p><strong>{{ mekan.isim }}</strong> kaydını silmek istediğinize emin misiniz?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button class="danger-btn" type="submit">Evet, sil</button>
            <a href="{% url 'mekan-detay' mekan.id %}">Vazgeç</a>
        </div>
    </form>
</div>
{% include "partials/footer.html" %}
</body>
</html>
