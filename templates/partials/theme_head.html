<link rel="icon" type="image/png" href="/static/images/lezzet-duraklari-logo.png">
<link rel="shortcut icon" type="image/png" href="/static/images/lezzet-duraklari-logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="/static/css/pro_ui.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

    :root {
        --bg: #f6f8fb;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --text: #111827;
        --muted: #64748b;
        --border: #e5e7eb;
        --accent: #ea580c;
        --accent-border: #c2410c;
        --link: #0f766e;
        --lime: #15803d;
        --shadow: 0 8px 22px rgba(15, 23, 42, 0.07);
        --ring: 0 0 0 3px rgba(37, 99, 235, 0.13);
    }

    [data-theme="dark"] {
        --bg: #0f1115;
        --surface: #171b23;
        --surface-soft: #11151d;
        --text: #e5e7eb;
        --muted: #aeb7c5;
        --border: #2a2f3a;
        --accent: #f97316;
        --accent-border: #ea580c;
        --link: #5eead4;
        --lime: #86efac;
        --shadow: 0 10px 24px rgba(0, 0, 0, 0.34);
        --ring: 0 0 0 3px rgba(96, 165, 250, 0.18);
    }

    * {
        box-sizing: border-box;
    }

    html, body {
        min-height: 100%;
    }

    body, input, textarea, select, button {
        font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif !important;
    }

    body {
        line-height: 1.5;
        letter-spacing: 0;
        background-image: linear-gradient(180deg, rgba(255,255,255,.72), rgba(238,243,248,.88));
    }

    h1, h2, h3 {
        letter-spacing: -0.01em;
        margin-bottom: 0.6rem;
    }

    p {
        margin-top: 0.45rem;
        margin-bottom: 0.7rem;
    }

    .box, .wrap, .panel {
        border-radius: 12px !important;
        box-shadow: var(--shadow);
    }

    .panel h2 {
        border-top-left-radius: 12px;
        border-top-right-radius: 12px;
    }

    body {
        background: var(--bg) !important;
        color: var(--text) !important;
    }

    [data-theme="dark"] body {
        background-image: linear-gradient(180deg, rgba(23,27,35,.92), rgba(15,17,21,.96));
    }

    .box, .wrap, .panel, .card {
        background: var(--surface) !important;
        border-color: var(--border) !important;
        color: var(--text) !important;
        box-shadow: var(--shadow);
    }

    .card:hover {
        background: var(--surface-soft) !important;
        transform: translateY(-2px);
        box-shadow: 0 14px 34px rgba(15, 23, 42, 0.10);
    }

    .card {
        transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }

    .card:hover {
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
    }

    input, textarea, select {
        background: var(--surface-soft) !important;
        border-color: var(--border) !important;
        color: var(--text) !important;
        border-radius: 10px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: #93c5fd !important;
        box-shadow: var(--ring);
    }

    button:not(.link-btn):not(.theme-toggle), .btn {
        background: var(--surface) !important;
        border: 1px solid var(--border) !important;
        color: var(--text) !important;
        border-radius: 10px !important;
        font-weight: 800;
        transition: transform 0.14s ease, filter 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
    }

    button:not(.link-btn):not(.theme-toggle):hover, .btn:hover {
        filter: none;
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
    }

    .btn-primary,
    .filter-submit,
    .search-btn {
        background: linear-gradient(135deg, #f97316 0%, var(--accent) 100%) !important;
        border-color: var(--accent) !important;
        color: #fff !important;
        box-shadow: 0 10px 18px rgba(234, 88, 12, 0.18) !important;
    }

    a {
        color: var(--link) !important;
        text-underline-offset: 2px;
        transition: opacity 0.16s ease;
    }

    a:hover {
        opacity: 0.88;
    }

    .topbar {
        background: rgba(255, 255, 255, 0.94) !important;
        color: var(--text) !important;
        border-bottom-color: var(--border) !important;
        backdrop-filter: blur(14px);
        box-shadow: var(--shadow);
    }
    [data-theme="dark"] .topbar {
        background: rgba(18, 21, 28, 0.94) !important;
    }

    .brand {
        font-weight: 700;
        letter-spacing: 0.01em;
    }
    .brand-logo {
        opacity: 1 !important;
        filter: none !important;
        mix-blend-mode: normal !important;
    }
    [data-theme="dark"] .brand-logo {
        filter: brightness(1.12) contrast(1.18) !important;
    }

    .auth-links a, .meta, .map-status, .puan {
        color: var(--muted) !important;
    }

    .badge-near {
        background: rgba(21, 128, 61, 0.10) !important;
        color: var(--lime) !important;
        border: 1px solid rgba(21, 128, 61, 0.24) !important;
        font-weight: 700;
    }

    .panel h2, .message, .msg {
        background: var(--surface-soft) !important;
        color: var(--text) !important;
        border-color: var(--border) !important;
        border-radius: 10px;
        position: relative;
        overflow: hidden;
    }
    .panel h2::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, #2563eb, #14b8a6);
    }

    .theme-toggle {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 9999;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 6px 10px;
        background: var(--surface);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
    }

    .theme-toggle:hover {
        filter: brightness(1.08);
    }

    .theme-toggle-track {
        width: 40px;
        height: 22px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #e2e8f0;
        position: relative;
        flex: 0 0 auto;
    }

    .theme-toggle-thumb {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.2s ease;
    }

    [data-theme="dark"] .theme-toggle-track {
        background: #334155;
    }

    [data-theme="dark"] .theme-toggle-thumb {
        left: 20px;
    }

    .theme-toggle-label {
        color: var(--text);
        font-size: 16px;
        line-height: 1;
        width: 1.2em;
        text-align: center;
    }

    .theme-toggle--in-header {
        position: static;
        right: auto;
        bottom: auto;
        z-index: 1;
        margin-left: 12px;
        box-shadow: none;
        color: var(--text);
    }

    @media (max-width: 600px) {
        .theme-toggle {
            right: 10px;
            bottom: 10px;
            padding: 5px 9px;
            font-size: 14px;
        }
        .theme-toggle--in-header {
            margin-left: 0;
            min-height: 40px;
            justify-content: center;
            flex: 1 1 auto;
        }
    }
</style>
<script>
    (function () {
        var storedTheme = localStorage.getItem("theme");
        if (!storedTheme) {
            return;
        }
        document.documentElement.setAttribute("data-theme", storedTheme);
    })();
</script>
