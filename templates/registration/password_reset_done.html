<!doctype html>
{% load static %}
<html lang="tr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bağlantı Gönderildi</title>
    {% include "partials/theme_head.html" %}
    <link rel="stylesheet" href="{% static 'css/auth_ui.css' %}">
    <style>
        * { box-sizing: border-box; }
        html { overflow-x: hidden; }
        body { margin: 0; background: #f5f7fa; font-family: "Inter", "Segoe UI", sans-serif; color: #1f2937; overflow-x: hidden; }
        .box { max-width: 500px; margin: 60px auto; background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 24px; box-shadow: 0 14px 30px rgba(15,23,42,.1); }
        .btn { min-height: 42px; border-radius: 9px; border: 1px solid #ea580c; background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; padding: 0 14px; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; }
        @media (max-width: 560px) {
            .box {
                width: calc(100% - 20px);
                margin: 24px auto;
                padding: 18px;
            }
            h1 {
                font-size: 28px;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
{% include "partials/theme_toggle.html" %}
<main class="box">
    <h1>Bağlantı Gönderildi</h1>
    <p class="auth-lead">E-posta adresi sistemde kayıtlıysa şifre sıfırlama bağlantısı gönderildi.</p>
    <a class="btn" href="{% url 'giris' %}">Giriş Sayfasına Dön</a>
</main>
{% include "partials/footer.html" %}
</body>
</html>
